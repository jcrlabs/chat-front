server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow embedding only from the portfolio — modern browsers use frame-ancestors over X-Frame-Options
    add_header Content-Security-Policy "frame-ancestors 'self' https://home.jcrlabs.net" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
